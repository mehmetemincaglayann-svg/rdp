name: Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - name: Uçtan uca test
        run: python tests/test_e2e.py
      - name: Gerçek ücretsiz servislerle deneme
        continue-on-error: true
        run: python tests/test_public.py
      - run: pyinstaller --noconfirm --onefile --noconsole --name PyRemoteHost run_host.py
      - run: pyinstaller --noconfirm --onefile --noconsole --name PyRemoteViewer run_viewer.py
      - name: Paketlenmiş exe dosyalarını dene
        shell: pwsh
        run: |
          foreach ($name in "PyRemoteHost", "PyRemoteViewer") {
            $out = "$env:RUNNER_TEMP\$name.txt"
            $p = Start-Process -FilePath "dist\$name.exe" -ArgumentList "--selftest", $out -Wait -PassThru
            Write-Host "$name -> cikis kodu $($p.ExitCode)"
            Get-Content $out
            if ($p.ExitCode -ne 0) { exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: pyremote-windows
          path: dist/*.exe
